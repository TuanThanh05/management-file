# Chạy bằng Docker (tùy chọn; máy đã cài MySQL sẵn thì không cần file này).
#   docker compose up -d                          -> chỉ MySQL (dev chạy backend bằng npm)
#   docker compose --profile app up -d --build    -> MySQL + backend API (cổng 3000)
# Lần đầu (volume còn trống) MySQL tự chạy database/records_retention.sql bằng root.
# Muốn tạo lại CSDL từ đầu: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: records-retention-mysql
    restart: unless-stopped
    # Quy ước CSDL: mọi DATETIME lưu theo UTC -> máy chủ MySQL chạy giờ UTC.
    # Không đặt TZ=Asia/Ho_Chi_Minh, vì CURRENT_TIMESTAMP sẽ thành giờ +07.
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Cần đặt MYSQL_ROOT_PASSWORD trong .env}
      # Không dùng MYSQL_DATABASE / MYSQL_USER: image sẽ cấp ALL PRIVILEGES (kể cả DELETE) cho user đó.
      # CSDL và tài khoản app_retention (đặc quyền tối thiểu) do script SQL tạo.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/records_retention.sql:/docker-entrypoint-initdb.d/01_records_retention.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    build: .
    container_name: records-retention-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api_storage:/data/storage
      # Bản sao lưu: nên đổi thành thư mục trên ổ đĩa / máy khác, ví dụ - /mnt/nas/rr-backups:/backups
      - api_backups:/backups

volumes:
  mysql_data:
  api_storage:
  api_backups:
